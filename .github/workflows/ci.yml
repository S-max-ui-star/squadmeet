# CI (SCRUM-19): tests and Docker images on every pull request into dev and main.
# A merge into dev or main also pushes the images to GHCR, tagged with the commit SHA and
# the branch name. A merge into main then deploys that SHA to AWS (SCRUM-23).
# A manual run on dev or main (workflow_dispatch) does the same as a push; deploy/handover.sh
# uses it to build the images in the new owner's GHCR after the repo transfer (SCRUM-48).
# Actions are pinned to a commit SHA (the comment names the release), so a moved tag
# cannot change what runs here.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# A new push cancels the old run, but never on main: a deploy must not stop halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://squadmeet:squadmeet@localhost:5432/squadmeet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Start the PostGIS database (same image as docker compose)
        working-directory: .
        run: docker compose up --detach --wait db
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest

  frontend:
    name: Frontend lint, build and tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # Fallow checks only what the pull request changes: new dead code, duplication and
  # complex functions in frontend/. Config: .fallowrc.json. Report only for now
  # (continue-on-error), so a finding shows as an annotation but does not block the merge.
  fallow:
    name: Fallow audit (report only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the audit compares with the merge-base of the target branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: frontend/node_modules/.bin/fallow audit --base "origin/${{ github.base_ref }}" --format github-annotations

  # Known security holes in the dependencies (SCRUM-49 review). Report only, like fallow: a new
  # advisory must not block a merge on demo day, but it shows in the run.
  audit:
    name: Dependency audit (report only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx run pip-audit -r backend/requirements.txt
      - run: npm audit --omit=dev --audit-level=high
        if: always()
        working-directory: frontend

  images:
    name: Docker image (${{ matrix.image }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Images go to GHCR on a push to dev or main, or on a manual run on one of them.
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["dev", "main"]'), github.ref_name)) }}
    strategy:
      matrix:
        # deploy: compose.yml + host-deploy.sh for the SSM document squadmeet-deploy (SCRUM-47)
        image: [backend, frontend, db, deploy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The images belong to the repo's owner (since SCRUM-48 Stefan's account). GHCR needs
      # the owner name in lowercase, and GitHub expressions have no lowercase function.
      - name: Image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR (only when the images are published)
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.image }}
          push: ${{ env.PUBLISH == 'true' }}
          # Without PUBLISH nothing is pushed; "pr" only keeps the tag valid.
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/squadmeet-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/squadmeet-${{ matrix.image }}:${{ env.PUBLISH == 'true' && github.ref_name || 'pr' }}
          # The backend shows the SHA in /api/health; the deploy smoke test checks it.
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to AWS + smoke test
    needs: [images]
    # Without the deploy role there is no host to deploy to: between the repo transfer and
    # the new host's setup in deploy/handover.sh (SCRUM-48), a merge into main only builds.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # deploy.sh waits at most 35 min for the host + 3 min for the smoke test.
    timeout-minutes: 45
    # One deploy at a time; a second merge waits for the first.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for AWS; no AWS keys are stored in GitHub
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The role trusts only runs on main of this repo (deploy/setup-github-deploy.sh).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: deploy/deploy.sh "${{ github.sha }}"
