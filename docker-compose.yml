# Local development: `docker compose up` starts database, API and frontend.
# Map: http://localhost:5173   API: http://localhost:8000/api/health
services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-squadmeet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-squadmeet}
      POSTGRES_DB: ${POSTGRES_DB:-squadmeet}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-squadmeet}:${POSTGRES_PASSWORD:-squadmeet}@db:5432/${POSTGRES_DB:-squadmeet}
      # Cloudflare's public test keys for the captcha (SCRUM-27): the widget always passes.
      # Not secrets. Production reads the real keys from SSM (deploy/host-deploy.sh).
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-SquadMeet/1.0 (https://squadmeet.duckdns.org)}
      # Photos (SCRUM-42) in backend/photos/ (not in git); production uses S3 (PHOTO_BUCKET).
      PHOTO_DIR: photos
      # Photos are deferred (SCRUM-94): off like in production. "true" switches them on.
      PHOTOS_ENABLED: "false"
      # Optional Web Push keys (SCRUM-44). Keep the private value only in the ignored .env.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@squadmeet.duckdns.org}
    # --timeout-graceful-shutdown: an open live stream (SCRUM-93) would block each reload.
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 2"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
